id: appendix-stories
type: appendix
order: 3
title:
  eng: "Ten Short Stories"
  rus: "Десять коротких историй"
  zh: "十个小故事"

summary:
  eng: "Ten classic, public-domain tales, each drafted first in Toki Pona (reusing the exact word this dictionary already maps every Hao-shuo-de word to) and then rewritten in Hao-shuo-de -- a concrete demonstration of appendix-minimality's claim that both languages fill the same essential slots with different sound."
  rus: "Десять классических историй из общественного достояния, каждая сначала написана на Токипоне (используя те самые слова, к которым этот словарь уже привязывает каждое слово Hao-shuo-de), а затем переписана на Hao-shuo-de — наглядная демонстрация утверждения из приложения о минимализме, что оба языка заполняют одни и те же смысловые места разными звуками."
  zh: "十个经典的公共领域故事，每一个都先用道本语（Toki Pona）起草——沿用本词典早已为每个 Hao-shuo-de 词标注好的那个道本语对应词——然后再改写成 Hao-shuo-de。这是对《为什么极简是可行的》一文中那个说法的具体演示：两种语言用不同的声音填满同一组必要的位置。"

blocks:
  - type: prose
    text:
      eng: 'Every Hao-shuo-de word in this dictionary already carries its Toki Pona equivalent (see the "Maps to" line on any dictionary entry). That makes the two languages a natural pair for this exercise: draft a story in Toki Pona using only words that have a Hao-shuo-de counterpart, then rewrite it in Hao-shuo-de using exactly those counterparts and real Mandarin grammar instead. Where a concept genuinely has no word in either language, the story routes around it compositionally -- the same discipline lesson 2 already asked of you ("a written thing" instead of a dedicated word for book).'
      rus: "Каждое слово Hao-shuo-de в этом словаре уже несёт свой эквивалент на Токипоне (см. строку «Maps to» в любой словарной статье). Это делает два языка естественной парой для такого упражнения: сначала набросать историю на Токипоне, используя только слова, у которых есть соответствие в Hao-shuo-de, а затем переписать её на Hao-shuo-de, используя именно эти соответствия и настоящую мандаринскую грамматику. Там, где понятию действительно не находится слова ни в одном из языков, история обходит это композиционно — та же дисциплина, которую урок 2 уже требовал от вас («написанная вещь» вместо отдельного слова для книги)."
      zh: '本词典里的每一个 Hao-shuo-de 词，都已经标注了它对应的道本语词（见任意词条的 "Maps to" 一行）。这让这两种语言天然适合做这样一个练习：先只用那些在 Hao-shuo-de 里也有对应词的词汇，把故事用道本语起草出来，然后再用这些对应词和真正的普通话语法把它改写成 Hao-shuo-de。当某个概念在两种语言里确实都没有对应词时，故事就会像第二课已经要求你做的那样，用组合的方式绕过去（用"写的东西"代替专门表示"书"的词）。'

  - type: info
    title:
      eng: "New Words Added for This Appendix"
      rus: "Новые слова, добавленные для этого приложения"
      zh: "为本附录新增的词"
    items:
      - text:
          eng: '**{{word:sheng1yin1}}** (maps to *kalama*) -- sound, noise, voice. Already flagged as a gap in `CONTENT_CHECKLIST.md` (lesson-11 used the undictionaried "shengyin"); a dictionary word for sound is used constantly across storytelling (a strange sound, a cry, a call).'
          rus: "**{{word:sheng1yin1}}** (соответствует *kalama*) — звук, шум, голос. Уже отмечено как пробел в `CONTENT_CHECKLIST.md` (в уроке 11 использовалось несловарное «shengyin»); слово для звука постоянно нужно при рассказывании историй (странный звук, крик, зов)."
          zh: '**{{word:sheng1yin1}}**（对应道本语 *kalama*）——声音，噪音，嗓音。`CONTENT_CHECKLIST.md` 中已经标记过这个空缺（第11课使用了词典里没有的 "shengyin"）；讲故事时几乎离不开表示声音的词（奇怪的声音、叫喊、呼唤）。'
      - text:
          eng: "**{{word:zhen1}}** (maps to *lon*, the same word `zài`/`yǒu` already use for exist/have) -- true, real. TRUE is one of the ~65 NSM semantic primes `appendix-minimality.yaml` argues every language needs; the dictionary had no word for it at all."
          rus: "**{{word:zhen1}}** (соответствует *lon* — тому же слову, что уже используют `zài`/`yǒu` для существования/обладания) — истинный, настоящий. ИСТИННЫЙ — один из ~65 семантических примитивов NSM, которые, как утверждает `appendix-minimality.yaml`, нужны любому языку; в словаре для него вообще не было слова."
          zh: '**{{word:zhen1}}**（对应道本语 *lon*——`zài`/`yǒu` 已经用来表示存在/拥有的那个词）——真的，真实的。"真"（TRUE）是《为什么极简是可行的》一文所主张的、任何语言都需要的约65个NSM语义基元之一；词典里此前完全没有对应的词。'
      - text:
          eng: '**{{word:wen4}}** (to ask) and **{{word:na3li3}}** (where) -- neither is a Toki Pona primitive (Toki Pona composes both: "wile sona"/want-know for ask, reusing "seme"/what for where), but both are basic, one-syllable, one-word verbs in real Mandarin -- meeting this dictionary''s own stated bar for inclusion ("real Mandarin already lexicalizes it as one word"). Dialogue is the backbone of a fairy tale, and nominalizing every question ("the place you go to") reads stiffly next to the real thing.'
          rus: "**{{word:wen4}}** (спрашивать) и **{{word:na3li3}}** (где) — ни то, ни другое не является примитивом Токипоны (Токипона составляет оба значения: «wile sona» / хотеть-знать для «спрашивать», повторное использование «seme» / что для «где»), но оба — базовые, однослоговые, однословные глаголы в настоящем мандаринском — что отвечает собственному заявленному критерию этого словаря («настоящий мандаринский уже лексикализует это одним словом»). Диалог — это костяк сказки, а номинализация каждого вопроса («место, куда ты идёшь») звучит натянуто рядом с настоящей репликой."
          zh: '**{{word:wen4}}**（问）和 **{{word:na3li3}}**（哪里）都不是道本语的语义基元（道本语用组合方式表达二者："wile sona"/想知道 表示"问"，重复使用"seme"/什么 表示"哪里"），但二者在真正的普通话里都是基本的、单音节、单个词的说法——符合本词典自己设定的收词标准（"真正的普通话已经把它词化为一个词"）。对话是童话故事的骨架，而把每个疑问都名词化（"你要去的地方"）读起来会比真实的说法生硬得多。'
      - text:
          eng: '**{{word:pa4}}** (to fear, be afraid) -- like ask/where, not a Toki Pona primitive (composed there as "pilin ike"/feel-bad), but real Mandarin lexicalizes it as one common syllable, and fear is a distinct, recurring beat across danger-driven fairy tales that `juéde` + `huài` alone flattens into generic "feels bad".'
          rus: "**{{word:pa4}}** (бояться, страшиться) — как и «спрашивать»/«где», не примитив Токипоны (там составляется как «pilin ike» / чувствовать-плохо), но настоящий мандаринский лексикализует это одним обычным слогом, а страх — отдельный, повторяющийся мотив в сказках, построенных на опасности, который одни только `juéde` + `huài` сводят к обобщённому «чувствует себя плохо»."
          zh: '**{{word:pa4}}**（害怕，恐惧）——和"问"/"哪里"一样，也不是道本语的基元（在那里组合为"pilin ike"/感觉不好），但真正的普通话把它词化成了一个常见的单音节词；而在以危险为核心的童话故事里，恐惧是一个独立的、反复出现的情节点，仅靠 `juéde` 加 `huài` 只能把它压扁成笼统的"感觉不好"。'

