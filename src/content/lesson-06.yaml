id: lesson-06
type: lesson
lessonNumber: 6
order: 6
title:
  eng: "Dongzuo (Verbs)"

summary:
  eng: 'Verbs carry no tense; the particle le marks a completed action, and words shift category by context alone (chī as verb "eat" vs. noun "food").'

blocks:
  - type: vocab
    items:
      - term: "yǒu"
        definition:
          eng: "to have, contain, carry"
      - term: "tīng"
        definition:
          eng: "to listen to, hear, obey"
      - term: "chī"
        definition:
          eng: "to eat, drink, consume; food"
      - term: "zuò"
        definition:
          eng: "to make, do, work on"
      - term: "zhīdào"
        definition:
          eng: "to know"
      - term: "shuō"
        definition:
          eng: "to talk, speak, communicate"

  - type: prose
    text:
      eng: "Hao-shuo-de eliminates Toki Pona's direct object marker _e_ entirely by relying on standard Mandarin Subject-Verb-Object (SVO) word order."
    tldr:
      eng: "No direct-object marker is needed; SVO word order alone shows what the object is."
    necessity:
      eng: "Confirms Lesson 3's SVO order is doing double duty here, replacing a marker particle other minimal languages (like Toki Pona) rely on."

  - type: prose
    text:
      eng: 'Verbs do not change their forms to reflect past, present, or future tenses. Instead, aspect markers like the perfective particle `le` can be appended to show completed actions. Words fluidly shift roles depending on context -- for instance, `chī` represents the action "to eat" or the noun "food," while `zhīdào-de rén` acts as "a knowledgeable person".'
    tldr:
      eng: "Verbs carry no tense; `le` marks a completed action, and a word's category (verb vs. noun) shifts with context alone."
    necessity:
      eng: "Introduces the two mechanisms that stand in for tense and for separate word classes elsewhere in the grammar."

  - type: examples
    items:
      - pinyin: "Wǒ zhīdào hǎo shuō-de."
        translation:
          eng: "I know a simple language / good speech."
      - pinyin: "Nà-ge nánrén shì shuō-de rén."
        translation:
          eng: "That man is a messenger / speaking person."
      - pinyin: "Dà-de dòngwù zài chī nǐ."
        translation:
          eng: "A large animal is eating you."
      - pinyin: "Qún-de xiě-de dōngxi hěn hǎo."
        translation:
          eng: "The community's book is reliable."
      - pinyin: "Nǐ zuò le xīn-de chī."
        translation:
          eng: "You made new food."
      - pinyin: "Zhīdào-de rén tīng."
        translation:
          eng: "A person of knowledge listens."
      - pinyin: "Zhīdào-de dìfāng yǒu xiě-de dōngxi."
        translation:
          eng: "The school / house of knowledge has books."

  - type: exercise
    items:
      - eng: "I will listen to you."
      - eng: "The woman obeyed the man."
      - eng: "The friends ate meat."

  - type: answers
    items:
      - text:
          eng: "Wǒ tīng nǐ."
      - text:
          eng: "Nǚrén tīng le nánrén."
      - text:
          eng: "Hǎo-de rén chī le dòngwù."
