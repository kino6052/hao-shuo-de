title:
  eng: "Welcome to Hao-shuo-de!"
  rus: ""
  zh: ""

summary:
  eng: "Hao-shuo-de is a constructed language designed to help Chinese language learners to focus only on the important parts of the language and to master Chinese in a fraction of time."
  rus: "..."
  zh: ""

blocks:
  - type: prose
    text:
      eng: "Whether you are a beginner or an already seasoned student, you probably have been wondering - what is the 'best' way to learn Chinese? How can I make sure I learn it without getting stuck."
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "It would be near impossible to answer this definitively because there are just so many variables - both related to you - who you are, how you learn, what you know, as well as the variables related to the language - some methods are particularly good at teaching listening comprehension, some at reading, some at writing, some at speaking. However, all these methods take Chinese as it is and just presenting it to you, there is nothing fundamentally different about these methods.\n<h2>HSK framework is broken</h2>\nThe majority of methods are based on the HSK learning framework. On each level you learn a subset of vocabulary and pass exams. You have graded readers and exercises. However, HSK framework doesn't make you understand native Chinese - only sets expectations for yourself and others about your vocab list. Hao-shuo-de is a fundamentally different approach - you learn Chinese, but from the start you learn the actual language, not just vocabulary, it means that you can soon start watching real content and read real texts (in hao-shuo-de, not real Mandarin), as well as express yourself."
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "One of the most challenging part about learning Chinese is that it is an open sea - the finish line is forever far away - no level gets you to the point where you can say confidently - I know Chinese. With hao-shuo-de, you can say - I know hao-shuo-de within a couple of months - you will be able to express yourself and consume real content in it and will be ready to learn another language - jiandanhua - Mandarin, but with the finish line in sight - within months you will master it and you will be able to smoothly transition to the open sea of real Chinese having crossed two finish lines and being able to confidently say - I know hao-shuo-de and jiandan-hua - the language that the native Chiense speakers will understand when you speak"
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "Because hao-shuo-de and jiandan-hua are complete languages, it means you can translate anything to it - speech, movies, books. Because these language are real simplified Chinese - you are not wasting your time because you are learning real Chinese fundamentally correct way - by focusing on the right parts of the language. You will not have to realearn it. You will not have a moment like with HSK framework where spending many years you still feel stuck and far away from your goals"
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "<h2>How does hao-shuo-de help exactly?</h2>\nHao-shuo-de has only {{dictionaryCount}} words in it's vocabulary. It has a teaching framework, and a growing community and resources that allow you to master this language quickly."
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "Hao-shuo-de itself is a minimal language, so we don't spend much time on drilling the vocab - the resources that you will be studying are designed to address the main bottlenecks of learning Chinese - listening comprehension.\nOn our community platform you will find the learning pathway and you will see many listening execises - the main focus of the learning is listening - it is required for you to train your listening before you can pass this pathway. Once you are able to pass all the listening you unlock extra content like videos and eventually access to the the next level of language - jiandanhua - where you will learn a complete language that is extremely close to Mandarin while being far simpler."
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "So welcome to your Chinese learning journey with the right engineered approach. hao-hao lai-zhidao hao-shuo-de!"
      rus: ""
      zh: ""

