id: lesson-05
type: lesson
lessonNumber: 5
order: 5
title:
  eng: "You and I"
  rus: "Ты и я"
  zh: "你和我"

summary:
  eng: 'Pronouns like wǒ ("I") and nǐ ("you") behave exactly like ordinary number-neutral nouns and take the Subject spot; wǒ is strictly singular, and plural forms like "we" are built by adding other nouns (e.g., wǒ hé tā). Possession is shown by binding a pronoun to a noun with -de, the same particle from Lessons 2 and 4.'
  rus: "Местоимения вроде wǒ («я») и nǐ («ты») ведут себя точно как обычные, нейтральные к числу существительные, и занимают место Подлежащего; wǒ всегда единственное число, а множественные формы вроде «мы» строятся добавлением других существительных (например, wǒ hé tā). Принадлежность показывается присоединением местоимения к существительному через -de — ту же частицу из Уроков 2 и 4."
  zh: '像 wǒ（"我"）和 nǐ（"你"）这样的代词，表现得跟普通的、不分单复数的名词完全一样，占据主语的位置；wǒ 只是单数，复数形式如"我们"通过添加其他名词构成（如 wǒ hé tā）。所属关系通过把代词用 -de 连接到名词上来表示，这是第二课和第四课里同一个助词。'

blocks:
  - type: vocab
    items:
      - term: "wǒ"
        ttsText: "我"
        definition:
          eng: "I, me"
          rus: "я, меня"
          zh: "我"
      - term: "nánrén"
        ttsText: "男人"
        definition:
          eng: "man, male"
          rus: "мужчина, мужского пола"
          zh: "男人，男性"
      - term: "nǐ"
        ttsText: "你"
        definition:
          eng: "you"
          rus: "ты, вы"
          zh: "你，你们"
      - term: "qún"
        ttsText: "群"
        definition:
          eng: "community, group"
          rus: "сообщество, группа"
          zh: "群体，社区"
      - term: "xīn"
        ttsText: "新"
        definition:
          eng: "new, another, fresh"
          rus: "новый, другой, свежий"
          zh: "新的，另一，新鲜的"

  - type: prose
    text:
      eng: "Hao-shuo-de pronouns behave like any other noun you've already met — <audio-example zh=\"我\">wǒ</audio-example> (\"I\") and <audio-example zh=\"你\">nǐ</audio-example> (\"you\") simply take the Subject spot from Lesson 3, no special treatment required.\n\nLike every Hao-shuo-de noun, they carry no number of their own, but unlike English, <audio-example zh=\"我\">wǒ</audio-example> does not double as \"we\" — it always means \"I\" (singular). To say \"we,\" you combine it with other words: <audio-example zh=\"我和他\">wǒ hé tā</audio-example> (\"I and him/her\") or <audio-example zh=\"我和多人\">wǒ hé duō rén</audio-example> (\"I and many people\"). The same goes for <audio-example zh=\"你\">nǐ</audio-example>: it's \"you\" (singular) by default; for \"you all,\" you'd say something like <audio-example zh=\"你和他们\">nǐ hé tāmen</audio-example> (\"you and them\") or add a number. Context and added nouns do the work that English does with separate plural pronoun forms."
      rus: "Местоимения хао-шуо-дэ ведут себя как любые другие существительные, с которыми вы уже встречались — <audio-example zh=\"我\">wǒ</audio-example> («я») и <audio-example zh=\"你\">nǐ</audio-example> («ты») просто занимают место Подлежащего из Урока 3, без специальных правил.\n\nКак и любое существительное хао-шуо-дэ, они не имеют собственного числа, но в отличие от английского, <audio-example zh=\"我\">wǒ</audio-example> не означает одновременно «мы» — оно всегда «я» (единственное число). Чтобы сказать «мы», нужно соединить его с другими словами: <audio-example zh=\"我和他\">wǒ hé tā</audio-example> («я и он/она») или <audio-example zh=\"我和多人\">wǒ hé duō rén</audio-example> («я и много людей»). То же самое с <audio-example zh=\"你\">nǐ</audio-example>: по умолчанию это «ты» (единственное число); для «вы» (множественное) нужно сказать что-то вроде <audio-example zh=\"你和他们\">nǐ hé tāmen</audio-example> («ты и они») или добавить число. Контекст и добавленные существительные делают ту работу, которую в английском выполняют отдельные формы множественного числа местоимений."
      zh: "好说得的代词跟你已经见过的任何名词一样——<audio-example zh=\"我\">wǒ</audio-example>（\"我\"）和 <audio-example zh=\"你\">nǐ</audio-example>（\"你\"）只是填进第三课的主语位置，不需要特殊处理。\n\n像每一个好说得的名词一样，它们本身不区分单复数，但跟英语不同的是，<audio-example zh=\"我\">wǒ</audio-example> 并不兼作\"我们\"——它永远只是\"我\"（单数）。要说\"我们\"，需要把它跟其他词组合起来：<audio-example zh=\"我和他\">wǒ hé tā</audio-example>（\"我和他/她\"）或 <audio-example zh=\"我和多人\">wǒ hé duō rén</audio-example>（\"我和许多人\"）。<audio-example zh=\"你\">nǐ</audio-example> 也一样：默认是\"你\"（单数）；要说\"你们\"，可以说 <audio-example zh=\"你和他们\">nǐ hé tāmen</audio-example>（\"你和他们\"）或加上数量。语境和添加的名词承担了英语里用独立复数代词形式所做的工作。"
    tldr:
      eng: 'Pronouns are ordinary nouns that fill the Subject spot; wǒ means "I" only, and plural forms like "we" are built with additional nouns.'
      rus: "Местоимения — это обычные существительные, занимающие место Подлежащего; wǒ означает только «я», а множественные формы вроде «мы» строятся с помощью дополнительных существительных."
      zh: '代词是普通名词，填入主语位置；wǒ 只表示"我"，复数如"我们"需要通过添加其他名词来表达。'
    necessity:
      eng: 'Clarifies that wǒ is strictly singular, unlike English "I/we," and shows how plural pronouns are formed compositionally rather than with a separate set of words.'
      rus: "Уточняет, что wǒ всегда единственное число, в отличие от английского «I/we», и показывает, как множественные местоимения образуются составным способом, а не с помощью отдельного набора слов."
      zh: "说明 wǒ 严格是单数，不像英语的 I/we 兼作复数，并展示了复数代词如何通过组合方式构成，而不是用另一套独立的词。"

  - type: prose
    text:
      eng: 'To show possession, bind the pronoun to a noun with <code>-de</code>, the same connecting particle from Lessons 2 and 4: <audio-example zh="我的">wǒ-de</audio-example> ("my"), <audio-example zh="你的">nǐ-de</audio-example> ("your"). Same hyphen, same job — gluing one word onto another to form a single descriptive unit — whether what''s doing the describing is an adjective, a verb turned into a noun, or now, a pronoun.'
      rus: 'Чтобы показать принадлежность, присоедините местоимение к существительному через <code>-de</code> — ту же связующую частицу из Уроков 2 и 4: <audio-example zh="我的">wǒ-de</audio-example> («мой»), <audio-example zh="你的">nǐ-de</audio-example> («твой»). Тот же дефис, та же работа — склеить одно слово с другим в единую описательную единицу — независимо от того, что именно описывает: прилагательное, превращённый в существительное глагол или, как теперь, местоимение.'
      zh: '要表示所属关系，把代词用 <code>-de</code> 连接到一个名词上——也就是第二课和第四课里那个连接用的助词：<audio-example zh="我的">wǒ-de</audio-example>（"我的"）、<audio-example zh="你的">nǐ-de</audio-example>（"你的"）。同一个连字符，同一种工作——把一个词粘到另一个词上，组成一个单一的描述单位——不管在描述的是形容词、由动词变来的名词，还是现在的代词。'
    tldr:
      eng: 'Possession is shown by binding a pronoun to a noun with -de: wǒ-de ("my"), nǐ-de ("your").'
      rus: "Принадлежность показывается присоединением местоимения к существительному через -de: wǒ-de («мой»), nǐ-de («твой»)."
      zh: '所属关系通过把代词用 -de 连接到名词上来表示：wǒ-de（"我的"）、nǐ-de（"你的"）。'
    necessity:
      eng: "Shows -de doing the same job a third time (after adjectives and verb-to-noun), confirming it's one general binding rule, not three separate ones."
      rus: "Показывает, что -de выполняет ту же работу уже в третий раз (после прилагательных и превращения глагола в существительное), подтверждая, что это одно общее правило связывания, а не три разных."
      zh: "展示 -de 第三次执行同样的工作（继形容词和动词变名词之后），确认这是一条通用的连接规则，而不是三条各自独立的规则。"

  - type: examples
    items:
      - pinyin: "Wǒ shì rén."
        ttsText: "我是人。"
        translation:
          eng: "I am a person."
          rus: "Я человек."
          zh: "我是人。"
      - pinyin: "Wǒ shì nánrén."
        ttsText: "我是男人。"
        translation:
          eng: "I am a man."
          rus: "Я мужчина."
          zh: "我是男人。"
      - pinyin: "Nǐ shì hǎo-de rén."
        ttsText: "你是好的人。"
        translation:
          eng: "You are a good person."
          rus: "Ты хороший человек."
          zh: "你是好人。"
      - pinyin: "Zhè-ge shì wǒ-de xiě-de dōngxi."
        ttsText: "这个是我的写的东西。"
        translation:
          eng: "This is my document."
          rus: "Это мой документ."
          zh: "这是我的文件。"
      - pinyin: "Nǐ-de dìfāng hěn xīn."
        ttsText: "你的地方很新。"
        translation:
          eng: "Your place is new."
          rus: "Твоё место новое."
          zh: "你的地方很新。"
      - pinyin: "Wǒ-de qún hěn dà."
        ttsText: "我的群很大。"
        translation:
          eng: "My community is large."
          rus: "Моё сообщество большое."
          zh: "我的群体很大。"
      - pinyin: "Nánrén-de dòngwù hěn xiǎo."
        ttsText: "男人的动物很小。"
        translation:
          eng: "The man's animal is small."
          rus: "Животное этого мужчины маленькое."
          zh: "那个男人的动物很小。"

  - type: exercise
    items:
      - eng: "Your fruit is good."
        rus: "Твой фрукт хороший."
        zh: "你的水果很好。"
      - eng: "This is a new community."
        rus: "Это новое сообщество."
        zh: "这是一个新的群体。"
      - eng: "I am a good person."
        rus: "Я хороший человек."
        zh: "我是一个好人。"

  - type: answers
    items:
      - text:
          eng: "Nǐ-de shuǐguǒ hěn hǎo."
          rus: "Nǐ-de shuǐguǒ hěn hǎo."
          zh: "Nǐ-de shuǐguǒ hěn hǎo."
        ttsText: "你的水果很好。"
      - text:
          eng: "Zhè-ge shì xīn-de qún."
          rus: "Zhè-ge shì xīn-de qún."
          zh: "Zhè-ge shì xīn-de qún."
        ttsText: "这个是新的群。"
      - text:
          eng: "Wǒ shì hǎo-de rén."
          rus: "Wǒ shì hǎo-de rén."
          zh: "Wǒ shì hǎo-de rén."
        ttsText: "我是好的人。"
