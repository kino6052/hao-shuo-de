id: lesson-01
type: lesson
lessonNumber: 1
order: 1
title:
  eng: "Sounds and Symbols"
  rus: "Звуки и символы"
  zh: "声音与符号"

summary:
  eng: "Pinyin is how we write Chinese using Roman alphabet. It is written syllable by syllable. It has marks indicating tones. In hao-shuo-de we writing pinyin with spaces, hyphens and quotation marks to make it more readable and understandable. Mastering pinyin is one of the most fundamental skills in learning Chinese."
  rus: ""
  zh: ""

blocks:
  - type: prose
    text:
      eng: "Chinese is very different from the western languages on many levels. One such example is what the smallest piece in the written language is. In western language such smallest piece is a letter - we build words from letters, we can spell words from letters. In Chinese it is not like that - the smallest piece is a syllable."
      rus: ""
      zh: ""
    tldr:
      eng: "There are no letters in Chinese because the smallest written piece is a syllable."
      rus: ""
      zh: ""
    necessity:
      eng: "Required to understand how to read pinyin"
      rus: ""
      zh: ""

  - type: info
    title:
      eng: "Important!"
      rus: ""
      zh: ""
    items:
      - text:
          eng: "Get in the habit of reading pinyin words syllable by syllable, not as one whole word (the way we do in our alphabetic languages)."
          rus: ""
          zh: ""
        items:
          - text:
              eng: "<i>Syllables</i>: <b>Zhōng</b> and <b>guó</b>"
              rus: "<i>Слоги:</i> <b>Zhōng</b> и <b>guó</b>"
              zh: "<i>音节：</i> <b>Zhōng</b> 和 <b>guó</b>"

  - type: prose
    text:
      eng: "Even though pinyin attempts to capture how the words sound it is still not detailed enought to capture the details of the pronounciation, so it is important to learn exactly how each syllable is pronounced. For this we have a dedicated rigorous prounciation course that aims to train you in detailed understanding of the basic pronounciation. Being able to understand the sounds of Chinese is the **MOST** fundamental and important skill in Chinese on which everythign else will depend. So don't overlook this. Here is the [LINK]"
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "<h2>Tones</h2>\n\nIn pinyin, tone isn't decoration — it's part of the word."
      rus: |-
        <h2>Тоны</h2>

        В пиньинь, тон — не украшение, а часть слова
      zh: "<h2>声调</h2>\n\n在拼音中，声调不是装饰，而是词的一部分。"
    tldr:
      eng: "Tone is part of the word, not decoration"
      rus: "Тон — часть слова, а не украшение"
      zh: "声调是词的一部分，而非装饰"
    necessity:
      eng: "Tones are a fundamental and necessary part of Chinese and pinyin"
      rus: ""
      zh: ""

  - type: info
    title:
      eng: "Example"
      rus: "Пример"
      zh: "例子"
    items:
      - text:
          eng: "**mā** — mother"
          rus: "**mā** — мама"
          zh: "**mā** — 妈妈"
      - text:
          eng: "**má** — hemp"
          rus: "**má** — конопля"
          zh: "**má** — 麻"
      - text:
          eng: "**mǎ** — horse"
          rus: "**mǎ** — лошадь"
          zh: "**mǎ** — 马"
      - text:
          eng: "**mà** — to scold"
          rus: "**mà** — ругать"
          zh: "**mà** — 骂"

  - type: prose
    text:
      eng: "All the words above are different, and are pronounced differently, because they use different tones.\n\nChinese has the following tones:"
      rus: |-
        Все приведенные выше слова -- разные, и произносятся они по разному, потому что используют разные тоны.

        В китайском языке существуют следующие тоны:
      zh: "以上的词都各不相同，读音也不同，因为它们使用了不同的声调。\n\n汉语共有以下几种声调："

  - type: info
    title:
      eng: "Tones"
      rus: "Тоны"
      zh: "声调"
    items:
      - text:
          eng: '**ā** — First tone. Level and sustained, as if you''re humming a single unchanging note (like "om").'
          rus: "**ā** — Первый тон. Ровный и долгий, словно вы мычите одну ноту без изменений (например “ом“)."
          zh: "**ā** — 一声。平稳而绵长，就像你哼着一个不变的音（比如“om”）。"
      - text:
          eng: '**á** — Second tone. Rising, like the "huh?" you say when you didn''t quite hear something.'
          rus: "**á** — Второй тон. Восходящий, как «а?», которое вы говорите, когда не расслышали."
          zh: "**á** — 二声。上扬，就像你没听清楚时说的“啊？”。"
      - text:
          eng: '**ǎ** — Third tone. Dips down first, then curls back up — the sound of a skeptical "hmm..."'
          rus: "**ǎ** — Третий тон. Сначала понижается, затем загибается вверх — звук скептического «хм...»"
          zh: "**ǎ** — 三声。先降后升，像是怀疑时发出的“嗯……”声。"
      - text:
          eng: '**à** — Fourth tone. Sharp and falling, like a clipped, final "No."'
          rus: "**à** — Четвёртый тон. Резкий и нисходящий, как отрывистое, окончательное «Нет»."
          zh: "**à** — 四声。短促而下降，像是斩钉截铁的一声“不”。"
      - text:
          eng: "**a** — Neutral tone. It's written without a tone mark, just as a plain letter. The neutral tone is shorter and unstressed. In the word Hǎo-shuō-de, the final syllable de carries the neutral tone."
          rus: "**a** — Нейтральный тон. Он пишется без знака тона, просто как слово или буква. Нейтральный тон короче и является безударным. В слове Hǎo-shuō-de последний слогde имеет нейтральный тон."
          zh: "**a** — 轻声。书写时不带声调符号，只是普通字母。轻声更短，且不重读。在 Hǎo-shuō-de 一词中，最后一个音节 de 就是轻声。"

  - type: prose
    text:
      eng: "All of Chinese is read in tones, syllable by syllable. The one exception is the neutral tone. When it appears in a word, the syllable before it gets the stress, and the neutral tone itself is just a short, unstressed sound.\n\nThe word Hǎo-shuō-de isn't three equal beats. It's pronounced hao-shuò-de — the final syllable \"de\" fades out.\n\nWithout the neutral tone, spoken Chinese wouldn't sound spoken. In fact the literary Chinese is often spoken like that - it has its charm but it is very unnatural for daily speaking. It's the neutral tone that keeps the rhythm from falling apart."
      rus: ""
      zh: ""

  - type: prose
    text:
      eng: "In natural Chinese speech there are rules for how certain tones shift when syllables sit next to each other. These changes are called tone sandhi (it's academic name)"

  - type: info
    title:
      eng: "Rest"
      rus: ""
      zh: ""
    items:
      - text:
          eng: |-
            4. Why does tone sandhi happen? (The Linguistic Reason)
            Tone sandhi exists for articulatory economy.

            The full third tone (214) requires your vocal cords to drop in pitch, compress, and then sharply rise. This is a massive muscular movement.

            Doing that twice in a row (e.g., nǐ hǎo) is physically tiring. So, the brain "shares" the work: it moves the rising part of the first tone to the end of the second tone, turning the first into a straight rise (2nd tone) so your throat doesn't have to bottom out twice.

            It gives spoken Chinese a rhythmic "wave" rather than a choppy, jerky sound.

            5. Lexical vs. Phrasal Sandhi (Crucial Distinction)
            It is vital to know that sandhi operates differently based on syntactic boundaries (pauses and word groups):

            Lexical Sandhi: Happens inside fixed compound words. (e.g., 好好 hǎo hǎo → háo hǎo means "properly").

            Phrasal Sandhi: Happens across word boundaries, unless there is a natural pause or contrastive stress.

            Example: 买 (buy) + 好 (good) = 买好 (to buy well). Sandhi applies: mái hǎo.

            However, if you say 买 (buy) + 好 (good) with a pause to emphasize the word "good", the sandhi is blocked, and both remain third tones. Pauses block sandhi.

          rus: ""
          zh: ""

  - type: prose
    text:
      eng: "In this book, the tone of each syllable is its dictionary tone (i.e. taken straight from the dictionary)."

  - type: prose
    text:
      eng: "In regular Chinese, sentences are built from syllables, with no spaces or extra notation that will help us to understand where words start and end. To make the structure of Chinese clearer to us, Hao-shuo-de adds a few extra grammar rules on top."
      rus: ""
      zh: ""
    tldr:
      eng: "Hao-shuo-de adds punctuation on top of syllabic writing"
      rus: "Hao-shuo-de добавляет пунктуацию поверх слогового письма"
      zh: "Hao-shuo-de 在音节文字之上加入了标点规则"
    necessity:
      eng: "Without these rules, you can't see where words and grammar particles begin and end in Chinese text."
      rus: "Без этих правил невозможно увидеть границы слов и грамматических частиц в китайском тексте"
      zh: "没有这些规则，就无法在中文文本中看清词语和语法成分的边界。"

  - type: info
    title:
      eng: "Hao-shuo-de pinyin helpers"
      rus: ""
      zh: ""
    ordered: true
    items:
      - text:
          eng: "**Words are written solid**. When several syllables form one dictionary word, they are never split apart, no matter how long the word is — {{word:dong4wu4}}, {{word:shui4jiao4}}, {{word:dan4shi4}}. Read the whole solid block as a single unit."
          rus: "**Слова пишутся слитно**. Когда несколько слогов образуют одно словарное слово, они никогда не разделяются, какой бы длинной ни была лексема, — {{word:dong4wu4}}, {{word:shui4jiao4}}, {{word:dan4shi4}}. Читайте весь слитный блок как единое целое."
          zh: "**词连写**。当若干音节组成一个词典词时，无论这个词有多长，它们都绝不会被拆开——{{word:dong4wu4}}、{{word:shui4jiao4}}、{{word:dan4shi4}}。把整个连写的部分当作一个整体来读。"
      - text:
          eng: "**A hyphen transforms a word**. A hyphen attaches a grammar particle, a measure word, or a modifier to a word and turns it into a different part of speech (for example, from a noun into an adjective, or from a verb into an adjective)."
          rus: "**Дефис трансформирует слово**. Дефис прикрепляет к слову грамматическую частицу, счетное слово или определение и трансформирует его в другую часть речи (к примеру, из существительного в прилагательное или из глагола в прилагательное)."
          zh: "**连字符转换词性**。连字符把一个语法成分、量词或修饰语附加到词上，并把它转换成另一种词性（例如，从名词变成形容词，或从动词变成形容词）。"
        items:
          - text:
              eng: "{{word:zhe4}}-**ge** — this"
              rus: "{{word:zhe4}}-**ge** — этот"
              zh: "{{word:zhe4}}-**ge** — 这个"
          - text:
              eng: "{{word:yi1}}-**ge** — one thing"
              rus: "{{word:yi1}}-**ge** — одна вещь"
              zh: "{{word:yi1}}-**ge** — 一个（东西）"
          - text:
              eng: "{{word:hen3}}-**{{word:da4}}-de** — very big"
              rus: "{{word:hen3}}-**{{word:da4}}-de** — очень большой"
              zh: "{{word:hen3}}-**{{word:da4}}-de** — 很大的"
          - text:
              eng: "A hyphen always shows that the parts it joins work together as a single word."
              rus: "Дефис всегда указывает на то что связываемые им части работают как одно слово."
              zh: "连字符总是表明它所连接的部分作为一个整体来运作。"
      - text:
          eng: "**Quotes set off the untranslatable**. Proper names and onomatopoeia — things that aren't really Hao-shuo-de vocabulary — are enclosed in quotes:"
          rus: "**Кавычки отделяют непереводимое**. Имена собственные и звукоподражания — то, что по сути не является лексикой Hao-shuo-de, — заключаются в кавычки:"
          zh: "**引号标出不可译内容**。专有名词和拟声词——这些本质上不属于 Hao-shuo-de 词汇的内容——用引号括起来："
        items:
          - text:
              eng: '"Beijing" — Beijing'
              rus: "“Beijing“ — Пекин"
              zh: "“Beijing“ — 北京"
          - text:
              eng: '{{word:jiao4}} "wāng-wāng" — barks "woof-woof"'
              rus: '{{word:jiao4}} "wāng-wāng" — лает «гав-гав»'
              zh: '{{word:jiao4}} "wāng-wāng" — 叫“汪汪”'
          - text:
              eng: "If you see quotes, don't look the word up in the dictionary — it isn't a dictionary word."
              rus: "Если видите кавычки, не ищите это слово в словаре; оно не словарное."
              zh: "如果看到引号，就不要在词典里查这个词——它不是词典词。"

  - type: exercise
    items:
      - eng: "Break Zhōngguórén into its syllables."
        rus: "Разбейте Zhōngguórén на слоги."
        zh: "把 Zhōngguórén 拆成音节。"
      - eng: "Which tone is this: à (fourth tone mark)? Describe it in one word."
        rus: "Какой это тон: à (знак четвёртого тона)? Опишите его одним словом."
        zh: "这是什么声调：à（四声符号）？用一个词描述它。"
      - eng: "Rewrite {{Word:wo3}} {{word:hao3}} using tone-number notation instead of tone marks."
        rus: "Перепишите {{Word:wo3}} {{word:hao3}} в тоново-цифровой записи вместо знаков тонов."
        zh: "把 {{Word:wo3}} {{word:hao3}} 用声调数字标注法改写（不用声调符号）。"
      - eng: "Is {{word:hen3}}-{{word:da4}}-de one dictionary word, or a word plus a bound grammar piece? How do you know from the punctuation alone?"
        rus: "Является ли {{word:hen3}}-{{word:da4}}-de одним словарным словом или словом плюс привязанной грамматической частью? Как вы это определяете только по знакам препинания?"
        zh: "{{word:hen3}}-{{word:da4}}-de 是一个词典词，还是一个词加一个粘着的语法成分？仅凭标点你如何判断？"

  - type: answers
    items:
      - text:
          eng: "Zhōng-guó-rén (three syllables: Zhōng, guó, rén)."
          rus: "Zhōng-guó-rén (три слога: Zhōng, guó, rén)."
          zh: "Zhōng-guó-rén（三个音节：Zhōng、guó、rén）。"
      - text:
          eng: "Fourth tone — sharp and falling."
          rus: "Четвёртый тон — резкий и нисходящий."
          zh: "四声 —— 短促下降。"
      - text:
          eng: "Wo3 hao3."
          rus: "Wo3 hao3."
          zh: "Wo3 hao3。"
      - text:
          eng: "A word ({{word:da4}}, big) plus a bound grammar piece (-de) — the hyphen shows they're glued together, not a single solid dictionary word."
          rus: "Слово ({{word:da4}}, большой) плюс привязанная грамматическая часть (-de) — дефис показывает, что они скреплены вместе, а не являются единым слитным словарным словом."
          zh: "一个词（{{word:da4}}，大）加上一个粘着的语法成分（-de）—— 连字符表明它们是粘在一起的，而不是一个固实的词典词。"
