  - type: exercise
    items:
      - eng: "Break Zhōngguórén into its syllables."
        rus: "Разбейте Zhōngguórén на слоги."
        zh: "把 Zhōngguórén 拆成音节。"
      - eng: "Which tone is this: à (fourth tone mark)? Describe it in one word."
        rus: "Какой это тон: à (знак четвёртого тона)? Опишите его одним словом."
        zh: "这是什么声调：à（四声符号）？用一个词描述它。"
      - eng: "Rewrite Wǒ hǎo using tone-number notation instead of tone marks."
        rus: "Перепишите Wǒ hǎo в тоново-цифровой записи вместо знаков тонов."
        zh: "把 Wǒ hǎo 用声调数字标注法改写（不用声调符号）。"
      - eng: "Is hěn-dà-de one dictionary word, or a word plus a bound grammar piece? How do you know from the punctuation alone?"
        rus: "Является ли hěn-dà-de одним словарным словом или словом плюс привязанной грамматической частью? Как вы это определяете только по знакам препинания?"
        zh: "hěn-dà-de 是一个词典词，还是一个词加一个粘着的语法成分？仅凭标点你如何判断？"

  - type: answers
    items:
      - text:
          eng: "Zhōng-guó-rén (three syllables: Zhōng, guó, rén)."
          rus: "Zhōng-guó-rén (три слога: Zhōng, guó, rén)."
          zh: "Zhōng-guó-rén（三个音节：Zhōng、guó、rén）。"
      - text:
          eng: "Fourth tone — sharp and falling."
          rus: "Четвёртый тон — резкий и нисходящий."
          zh: "四声 —— 短促下降。"
      - text:
          eng: "Wo3 hao3."
          rus: "Wo3 hao3."
          zh: "Wo3 hao3。"
      - text:
          eng: "A word (dà, big) plus a bound grammar piece (-de) — the hyphen shows they're glued together, not a single solid dictionary word."
          rus: "Слово (dà, большой) плюс привязанная грамматическая часть (-de) — дефис показывает, что они скреплены вместе, а не являются единым слитным словарным словом."
          zh: "一个词（dà，大）加上一个粘着的语法成分（-de）—— 连字符表明它们是粘在一起的，而不是一个固实的词典词。"
