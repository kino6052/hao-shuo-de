id: appendix-sandhi
type: appendix
order: 1.5
title:
  eng: "Tone Sandhi Reference"
  rus: "Справочник по тональному сандхи"
  zh: "声调连读变调参考"

summary:
  eng: "How tones actually change in connected speech: the 3rd-tone-pair rule and its 3+-in-a-row extension, the special-case sandhi for yī and bù, and neutral-tone sandhi -- pulled together as one reference alongside appendix-pinyin."
  rus: "Как тоны на самом деле меняются в слитной речи: правило для пары 3-х тонов и его расширение на 3 и более подряд, особые случаи сандхи для yī и bù, а также сандхи нейтрального тона — собраны в один справочник рядом с appendix-pinyin."
  zh: "连读时声调实际是如何变化的：两个三声相连的规则及其延伸到三个及以上连续三声的情况、yī 和 bù 的特殊变调，以及轻声连读变调——与 appendix-pinyin 放在一起，汇总成一份参考。"

blocks:
  - type: info
    title:
      eng: "3rd tone tone sandhi"
      rus: ""
      zh: ""
    items:
      - text:
          eng: |-
            Rule A: Third Tone + Third Tone → Second Tone + Third Tone
            When two third-tone syllables are adjacent, the first syllable completely loses its 'dipping' quality and rises straight up, sounding exactly like a second tone (˧˥ / 35).
            Example: nǐ (you, 你) + hǎo (good, 好) → ní hǎo (hello, 你好).
            Example: mǎi (buy, 买) + mǎ (horse, 马) → mái mǎ (buy a horse).
            Rule B: Third Tone + (1st, 2nd, or 4th Tone) → "Half Third" (21)
            If a third-tone syllable is followed by a first, second, or fourth tone (or most neutral tones), it does not rise. It only performs the low falling part of its pitch, dropping from low-mid to the very bottom (a pitch value of 21). It sounds like a low, grumbling growl.
            Example: lǎo (old, 老) + shī (teacher, 师 - 1st tone) → lǎo-shī (teacher). The lǎo stays low and flat, never rising.
            Example: hěn (very, 很) + hǎo (good, 好 - 3rd) → hén hǎo (applies Rule A). But if it's hěn + dà (big, 大 - 4th) → hěn dà (very big). The hěn becomes a low flat half-third.
            Rule C: Three or More Third Tones in a Row
            This is based on prosodic phrasing (rhythm groups). You split the string into chunks of 2 or 3 syllables, then apply Rule A.

            2+1 Grouping: wǒ (I) + hěn (very) + hǎo (good) → [wǒ hěn] + [hǎo] → wó hén hǎo (both the first and second become 2nd tone).

            1+2 Grouping: lǎo (old) + bǎo (precious) + bei (suffix) → [lǎo] + [bǎo bei] → láo báo bei (if it's a proper name, the first becomes 2nd, the second becomes 2nd, the last stays 3rd).
            Note: Native speakers do this subconsciously based on speech speed and rhythm.
          rus: ""
          zh: ""

  - type: info
    title:
      eng: "2. The Special Cases: 一 (yī) and 不 (bù)"
      rus: ""
      zh: ""
    items:
      - text:
          eng: |-

            The characters for "one" (一) and "not" (不) are high-frequency exceptions. Their sandhi depends entirely on the tone of the following character.

            Base Tone	When followed by...	Changes to...	Example	Pronunciation
            一 (yī) - 1st tone	4th tone	2nd tone (yí)	一 (one) + 样 (kind - 4th) = 一样 (same)	yí yàng
            一 (yī) - 1st tone	1st, 2nd, or 3rd tone	4th tone (yì)	一 + 天 (day - 1st) = 一天 (one day)	yì tiān
            一 (yī) - 1st tone	Standing alone / Counting	Stays 1st (yī)	第一 (first), 一二三 (one two three)	yī
            不 (bù) - 4th tone	4th tone	2nd tone (bú)	不 (not) + 是 (is - 4th) = 不是 (is not)	bú shì
            不 (bù) - 4th tone	1st, 2nd, or 3rd tone	Stays 4th (bù)	不 + 好 (good - 3rd) = 不好 (not good)	bù hǎo
            不 (bù) - 4th tone	Standing alone	Stays 4th (bù)	不！ (No!)	bù
          rus: ""
          zh: ""

  - type: info
    title:
      eng: "3. The Ghost Tone: Neutral Tone Sandhi"
      rus: ""
      zh: ""
    items:
      - text:
          eng: |-
            When a full tone is followed by a neutral tone (a light, unstressed syllable), the preceding full tone changes slightly in pitch to make the sentence flow:

            3rd + Neutral: The 3rd tone becomes a half-third (21). (e.g., 姐姐 jiě jie → jiě becomes low and flat).

            1st + Neutral: Stays high, but slightly shorter (e.g., 妈妈 mā ma).

            2nd + Neutral: Stays rising, but starts a bit higher (e.g., 爷爷 yé ye).

            4th + Neutral: Drops sharply to the bottom and stops abruptly (e.g., 妹妹 mèi mei).
          rus: ""
          zh: ""
