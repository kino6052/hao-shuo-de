id: word-map
type: word-map
order: 2
title:
  eng: "Word Map"
  rus: "Карта слов"
  zh: ""

summary:
  eng: "All the words as one map: each composite sits under the word it is a kind of, so you see what every word carries and which families the words form."
  rus: "Все слова на одной карте: каждое составное слово стоит под словом, разновидностью которого оно является, так что видно, что несёт каждое слово и какие семьи образуют слова."
  zh: ""

blocks:
  - type: prose
    text:
      eng: "Each dot is a word. Every composite sits under its head, the word that says what it is: a phone (shǒu-jī, hand machine) is a kind of jī, so it sits under jī, not under shǒu. The size of a dot is how many composites a word heads. Words that head related composites, share a category or carry the same atoms form a family, shown in one colour; the slider sets how much the categories and atoms count against the composites. Two words are linked when composites use them together."
      rus: "Каждая точка — слово. Каждое составное слово стоит под своим главным словом, тем, что говорит, что это такое: телефон (shǒu-jī, «ручная машина») — разновидность jī, поэтому он стоит под jī, а не под shǒu. Размер точки — сколько составных слов возглавляет слово. Слова, которые возглавляют родственные составные слова, входят в одну категорию или несут одни атомы, образуют семью одного цвета; ползунок задаёт, насколько категории и атомы весят против составных слов. Два слова связаны, если составные слова используют их вместе."
      zh: ""
    tldr:
      eng: "A map of the words: what each word heads, and its family."
      rus: "Карта слов: что возглавляет каждое слово и его семья."
      zh: ""
    necessity:
      eng: "It shows which words carry the language and which hardly connect."
      rus: "Она показывает, какие слова держат язык, а какие почти ни с чем не связаны."
      zh: ""
