<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yes/no panel</title>
<style>
  :root {
    --bg: #fafaf8; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #2f6fdb; --new: #e8f0fd; --yes: #1d7a46; --no: #b3382c; --partly: #9a6a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --card: #1f1f1c; --text: #ecebe6; --muted: #9a9992; --line: #34332f;
      --accent: #7aa7f5; --new: #1c2a42; --yes: #55c585; --no: #ef7f72; --partly: #e0b14a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --card: #1f1f1c; --text: #ecebe6; --muted: #9a9992; --line: #34332f;
    --accent: #7aa7f5; --new: #1c2a42; --yes: #55c585; --no: #ef7f72; --partly: #e0b14a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .topic { font-size: 20px; font-weight: 600; margin: 0 0 14px; overflow-wrap: anywhere; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .meter { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 18px; }
  .meter b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; border: 1px solid currentColor; }
  .chip.yes { color: var(--yes); } .chip.no { color: var(--no); } .chip.partly { color: var(--partly); }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  section header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  section h2 { font-size: 13px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  button { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  ul ul { margin-left: 16px; border-left: 1px solid var(--line); padding-left: 10px; }
  li, summary { padding: 3px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  summary { cursor: pointer; }
  summary .count { color: var(--muted); font-size: 12px; margin-left: 6px; }
  li.leaf::before { content: "•"; color: var(--muted); margin-right: 8px; }
  .fresh > summary, li.leaf.fresh { background: var(--new); }
  #open li::before { content: "?"; color: var(--accent); font-weight: 700; margin-right: 8px; }
  #open li.fresh { background: var(--new); }
  .hint { color: var(--muted); font-size: 13px; font-style: italic; margin: 1px 0 2px 20px; }
  .empty, #status { color: var(--muted); font-size: 13px; }
  #status.bad { color: var(--no); }
</style>
</head>
<body>
<main>
  <h1>Yes/no mode</h1>
  <p class="topic" id="topic">Waiting for the first answer…</p>
  <div class="bar"><div id="fill"></div></div>
  <div class="meter"><b id="percent">0%</b><span id="chip"></span><span class="muted" id="turn"></span></div>

  <section>
    <header><h2>Settled</h2><span><button id="expand">Expand all</button><button id="collapse">Collapse all</button></span></header>
    <ul id="settled"></ul>
  </section>
  <section>
    <header><h2>Open</h2></header>
    <ul id="open"></ul>
  </section>
  <p id="status">Connecting…</p>
</main>
<script>
  // What the person has folded or opened by hand wins over the page's own choice, and survives every refresh.
  const chosen = new Map();
  let last = '';
  let state = null;

  const $ = (id) => document.getElementById(id);
  const keyOf = (path) => path.join(' › ');
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; // the agent's words go in as text, never as markup
    return e;
  };

  function walk(nodes, path, visit) {
    for (const n of nodes) {
      const p = [...path, n.text];
      visit(n, p);
      walk(n.children ?? [], p, visit);
    }
  }

  // the agent marks the points it added this turn with "new": true; a branch holding one opens by itself, older branches fold
  function hasNew(node) {
    return node.new === true || (node.children ?? []).some(hasNew);
  }

  function build(nodes, path) {
    const ul = el('ul');
    for (const n of nodes) {
      const p = [...path, n.text];
      const key = keyOf(p);
      const fresh = n.new === true;
      if (!(n.children ?? []).length) {
        ul.append(el('li', 'leaf' + (fresh ? ' fresh' : ''), n.text));
        continue;
      }
      const li = el('li');
      const d = el('details', fresh ? 'fresh' : '');
      d.open = chosen.has(key) ? chosen.get(key) : hasNew(n);
      const s = el('summary', '', n.text);
      s.append(el('span', 'count', `(${(n.children ?? []).length})`));
      s.addEventListener('click', () => setTimeout(() => chosen.set(key, d.open), 0));
      d.append(s, build(n.children, p));
      li.append(d);
      ul.append(li);
    }
    return ul;
  }

  function render(s) {
    const turn = s.turn ?? 0;
    $('topic').textContent = s.topic ?? 'Waiting for the first answer…';
    $('fill').style.width = `${Math.max(0, Math.min(100, s.progress ?? 0))}%`;
    $('percent').textContent = `${s.progress ?? 0}%`;
    const chip = $('chip');
    chip.textContent = s.answer ? `${s.answer}${s.cut ? ` · ${s.cut}` : ''}` : '';
    chip.className = s.answer ? `chip ${String(s.answer).toLowerCase().replace(/[^a-z]/g, '')}` : '';
    $('turn').textContent = turn ? `after answer ${turn}` : '';
    const settled = $('settled');
    settled.replaceChildren(...((s.settled ?? []).length ? build(s.settled, []).childNodes : [el('li', 'empty', 'Nothing settled yet.')]));
    const open = $('open');
    open.replaceChildren(...((s.open ?? []).length ? s.open.map(openItem) : [el('li', 'empty', 'Nothing open.')]));
  }

  // an open item is { text, hint, new }; a bare string still shows, just without a hint
  function openItem(o) {
    const item = typeof o === 'string' ? { text: o } : o;
    const li = el('li', item.new === true ? 'fresh' : '', item.text);
    if (item.hint) li.append(el('div', 'hint', item.hint));
    return li;
  }

  function setAll(open) {
    if (state) walk(state.settled ?? [], [], (n, p) => { if ((n.children ?? []).length) chosen.set(keyOf(p), open); });
    render(state);
  }
  $('expand').onclick = () => setAll(true);
  $('collapse').onclick = () => setAll(false);

  async function poll() {
    try {
      const text = await (await fetch('/state', { cache: 'no-store' })).text();
      if (text !== last) {
        last = text;
        state = JSON.parse(text);
        render(state);
      }
      $('status').textContent = 'Live, updated after every answer.';
      $('status').className = '';
    } catch {
      $('status').textContent = 'Lost the panel server. Is node understand/panel/serve.js running?';
      $('status').className = 'bad';
    }
  }
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
