<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hao-shuo-de Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* The knowledge-base explorer, served by the dev server (vite-plugin-kb.js). It asks the same KB
   as the command line and the Claude tools, so the answers are the same text. */
:root {
  --paper: #f3f5f2;
  --card: #fbfcfa;
  --ink: #1b2420;
  --muted: #5d6a64;
  --line: #d6ddd7;
  --accent: #1d6f55;
  --accent-ink: #ffffff;
  --accent-soft: #dcece4;
  --warn: #9a5b00;
  --warn-soft: #f6e8d2;
  --danger: #a3332b;
  --danger-soft: #f5dedb;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131916; --card: #1a221e; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3833;
    --accent: #4fbf94; --accent-ink: #0d1a14; --accent-soft: #1f3a2f;
    --warn: #e0a24a; --warn-soft: #3b2e19; --danger: #ef7a70; --danger-soft: #3d2320;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-body); }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
header { display: grid; gap: 6px; margin-bottom: 18px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { font: 600 14px/1 var(--font-body); border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
form { display: grid; gap: 8px; margin-bottom: 16px; }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
input, textarea { flex: 1 1 260px; min-width: 0; font: 400 16px/1.4 var(--font-body); color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
textarea { min-height: 78px; resize: vertical; }
button.go { font: 600 14px/1 var(--font-body); background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
  border-radius: 8px; padding: 10px 16px; cursor: pointer; }
button.link { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.status { min-height: 1.5em; font-size: 14px; color: var(--muted); }
.status.err { color: var(--danger); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.title { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.han { font: 600 34px/1.1 var(--font-han); }
.py { font-size: 22px; font-weight: 600; }
.meta { font: 500 12px/1.4 var(--font-mono); color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font: 600 13px/1 var(--font-body); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; background: var(--card); font-variant-numeric: tabular-nums; }
.chip.hit { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.zero { color: var(--muted); }
pre.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 13.5px/1.55 var(--font-mono); }
.sentence { display: grid; gap: 6px; }
.sentence h3 { margin: 0; font-size: 17px; font-weight: 600; }
.badge { font: 600 12px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.flat { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.board-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--paper); display: grid; gap: 4px; align-content: start; min-height: 106px; }
.board-card .big { font: 600 24px/1.1 var(--font-body); font-variant-numeric: tabular-nums; }
.board-card svg { display: block; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
button.link-chip { cursor: pointer; }
h3 { margin: 0 0 8px; font-size: 16px; }
.row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.label { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
@media (max-width: 560px) { .han { font-size: 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Hao-shuo-de · knowledge base</div>
    <h1>Explorer</h1>
    <p class="lede">Ask the same questions Claude asks: what a word is and where it is used, what happens if we drop it, and whether a sentence fits the grammar patterns.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Question">
    <button class="tab" role="tab" id="tab-word" data-mode="word" aria-selected="true">Word</button>
    <button class="tab" role="tab" id="tab-remove" data-mode="remove" aria-selected="false">Drop a word</button>
    <button class="tab" role="tab" id="tab-parse" data-mode="parse" aria-selected="false">Parse a sentence</button>
    <button class="tab" role="tab" id="tab-atoms" data-mode="atoms" aria-selected="false">Atoms</button>
    <button class="tab" role="tab" id="tab-candidates" data-mode="candidates" aria-selected="false">Candidates</button>
    <button class="tab" role="tab" id="tab-add" data-mode="add" aria-selected="false">Add a root</button>
    <button class="tab" role="tab" id="tab-relations" data-mode="relations" aria-selected="false">Relations</button>
    <button class="tab" role="tab" id="tab-scoreboard" data-mode="scoreboard" aria-selected="false">Scoreboard</button>
  </div>

  <form id="ask" autocomplete="off">
    <div class="field" id="field-name">
      <input id="name" list="suggest" aria-label="Word" placeholder="dēng, deng1 or 灯" spellcheck="false">
      <datalist id="suggest"></datalist>
      <button class="go" type="submit">Ask</button>
    </div>
    <div class="field" id="field-text" hidden>
      <textarea id="text" aria-label="Sentence" placeholder="Wǒ shì rén. Zhè-ge rén hěn hǎo." spellcheck="false"></textarea>
      <button class="go" type="submit">Ask</button>
    </div>
    <p class="hint" id="hint"></p>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const HINTS = {
  word: 'One word, by its pinyin, its id (hao3) or its hanzi.',
  remove: 'One or more words, separated by spaces or commas. Nothing is changed; this only shows what would have to change.',
  parse: 'Plain pinyin ("Wǒ shì rén.") or text with word references. Several sentences are checked one by one.',
  atoms: 'Which words the others cannot be said from. Leave the box empty for the whole report, or name a word to see where it stands and how it is said.',
  candidates: 'The words that cost least to drop, the roots that would complete the most Mandarin words, and the best trades. Nothing to type. Worked out directly, not by the solver; the same lists as node scripts/kb.js audit.',
  add: 'One hanzi: the words it would complete, the ones that still need more roots, the composites it lets be spelled, and its sound against the words we have.',
  relations: 'The relations the data states or implies. Leave the box empty for the counts, or name a kind (opposite, close, same-form, kind-of, agent, category, ...) to see each with its reason.',
  scoreboard: 'The language\'s numbers now, charted against the rows stored after each change (kb/scoreboard.csv). Nothing to type.',
};
let mode = 'word';
let seq = 0;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function setMode(m, { keep = false } = {}) {
  mode = m;
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.mode === m));
  $('field-name').hidden = m === 'parse' || m === 'scoreboard' || m === 'candidates';
  $('field-text').hidden = m !== 'parse';
  $('name').placeholder = m === 'remove' ? 'dēng, fàn …' : m === 'atoms' ? 'a word (optional)' : m === 'add' ? 'a hanzi, e.g. 电' : m === 'relations' ? 'a kind (optional), e.g. opposite' : 'dēng, deng1 or 灯';
  $('name').setAttribute('aria-label', m === 'remove' ? 'Words to drop' : m === 'add' ? 'Root' : m === 'relations' ? 'Kind' : 'Word');
  $('hint').textContent = HINTS[m];
  if (!keep) { $('out').innerHTML = ''; $('status').textContent = ''; $('status').className = 'status'; }
}

async function api(path, params) {
  const r = await fetch(`/__kb/${path}?${new URLSearchParams(params)}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function say(message, bad = false) {
  $('status').textContent = message;
  $('status').className = bad ? 'status err' : 'status';
}

function wordCard(d) {
  const c = d.card;
  return `<section class="card">
    <div class="title"><span class="han">${esc(c.hanzi)}</span><span class="py">${esc(c.term)}</span><span class="meta">${esc(c.id)} · ${esc(c.pos ?? '')} · necessity ${esc(c.necessity?.index ?? '?')}</span></div>
    <div class="chips">
      <span class="chip">${c.composites.usedBy} composites use it</span>
      <span class="chip">${c.sentences.total} sentences</span>
      <span class="chip">${c.taught.length ? 'taught in ' + esc(c.taught.map((t) => t.lesson + '/' + t.module).join(', ')) : 'not taught as a card'}</span>
    </div>
    <pre class="text">${esc(d.text)}</pre>
    <p class="hint" style="margin-top:10px"><button class="link" data-remove="${esc(c.id)}">What happens if we drop ${esc(c.term)}?</button></p>
  </section>`;
}

const COUNTS = [
  ['redo', 'composites to redo'], ['loses', 'lose a form'], ['headLost', 'lose their head'], ['sentences', 'sentences to rewrite'],
  ['cards', 'word cards'], ['lost', 'coverage lost'], ['touched', 'coverage touched'], ['definitions', 'definitions name it'],
  ['senses', 'catch-all senses empty'], ['relations', 'pairs break'],
];

function removal(d) {
  const c = d.report.counts;
  const chips = COUNTS.map(([k, label]) => `<span class="chip ${c[k] ? 'hit' : 'zero'}">${c[k] ?? 0} ${esc(label)}</span>`).join('');
  return `<section class="card"><div class="chips">${chips}</div><pre class="text">${esc(d.text)}</pre></section>`;
}

function atomsReport(d) {
  const c = d.counts;
  const chip = (n, label, hit) => `<span class="chip ${hit ? 'hit' : n ? '' : 'zero'}">${n} ${esc(label)}</span>`;
  const chips = [
    chip(c.atoms, `true atoms (${c.marked} marked, ${c.clumsy} clumsy)`),
    chip(c.swappable, 'swappable'),
    chip(c.secondary, 'secondary'),
    chip(c.unreviewed, 'not reviewed yet', c.unreviewed > 0),
    chip(c.kernel, 'in the kernel'),
    chip(c.core, 'in the core'),
    chip(d.hidden.spelled, 'spelled forms (hidden vocabulary)'),
    chip(d.hidden.undecided, 'compounds still undecided', d.hidden.undecided > 0),
  ].join('');
  const kind = d.line ? `<p class="hint">${esc(d.line.kind)}</p>` : '';
  return `<section class="card"><div class="chips">${chips}</div>${kind}<pre class="text">${esc(d.text)}</pre></section>`;
}

// the numbers charted: [column, label, good direction (+1 up, -1 down, 0 none)]
const BOARD = [
  ['words', 'words', 0], ['composites', 'composites', 0], ['avg_form_words', 'words per description', -1],
  ['unreviewed', 'words not reviewed', -1], ['smallest_set', 'smallest defining set', -1], ['true_atoms', 'true atoms', 0],
  ['swappable', 'swappable', 0], ['secondary', 'secondary', 0], ['core', 'core', 0], ['spelled', 'spelled forms', 0],
  ['undecided_forms', 'compounds undecided', -1], ['items_with_form', 'coverage items sayable', 1], ['parse_rate', 'lessons 1-4 parse rate', 1], ['patterns', 'grammar patterns', 0],
];

// a small line over the stored rows, ending at the number now
function spark(values) {
  const w = 150, h = 38, pad = 4;
  const ys = values.filter((v) => typeof v === 'number');
  if (ys.length < 2) return '';
  const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const pts = values.map((v, i) => [pad + (i * (w - 2 * pad)) / (values.length - 1), typeof v === 'number' ? h - pad - ((v - lo) / span) * (h - 2 * pad) : null]);
  const line = pts.filter((p) => p[1] !== null).map((p) => p.join(',')).join(' ');
  const last = pts.filter((p) => p[1] !== null).at(-1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${values.length - 1} stored rows, then now"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/></svg>`;
}

function scoreboard(d) {
  const last = d.rows.at(-1);
  const cards = BOARD.map(([key, label, good]) => {
    const v = d.now[key];
    const before = last?.[key];
    const diff = typeof v === 'number' && typeof before === 'number' ? Math.round((v - before) * 1000) / 1000 : 0;
    const tone = !diff || !good ? '' : diff * good > 0 ? 'ok' : 'bad';
    const series = [...d.rows.map((r) => r[key]), v];
    return `<div class="board-card" title="${esc(d.columns[key])}">
      <div class="label">${esc(label)}</div>
      <div class="row"><span class="big">${v === '' ? '-' : esc(v)}</span>${diff ? `<span class="badge ${tone || 'flat'}">${diff > 0 ? '+' : ''}${diff}</span>` : ''}</div>
      ${spark(series)}
    </div>`;
  }).join('');
  const note = d.rows.length
    ? `Against the row of ${esc(last.date)}${last.label ? ` (${esc(last.label)})` : ''}; ${d.rows.length} stored row${d.rows.length === 1 ? '' : 's'}. Each line runs over the stored rows and ends at now.`
    : 'No stored rows yet.';
  return `<section class="card"><p class="hint">${note}</p><div class="board">${cards}</div></section>
    <section class="card"><details><summary>The same as text</summary><pre class="text">${esc(d.text)}</pre></details></section>`;
}

// the parts of a cost, shortened for a table cell
const PART_LABEL = { redo: 'redo', loses: 'loses form', headLost: 'head', lessonLine: 'lessons', compositeExample: 'examples', mention: 'mentions', coverageLost: 'coverage lost', coverageTouched: 'coverage touched', definition: 'definitions', sense: 'senses', relation: 'relations', mandarin: 'Mandarin' };
const costText = (parts) => Object.entries(parts).filter(([, v]) => v).map(([k, v]) => (PART_LABEL[k] ?? k) + ' ' + Math.round(v * 100) / 100).join(', ') || 'nothing';
const round = (x) => Math.round(x * 100) / 100;

function candidates(d) {
  const said = (s) => (s.source === 'atom' ? 'an atom' : s.source === 'none' ? 'no draft' : esc(s.forms.join(' / ')) + (s.verdict === 'clumsy' ? ' (clumsy)' : ''));
  const words = d.remove.map((r) => '<tr><td><button class="link" data-remove="' + esc(r.id) + '">' + esc(r.term) + ' ' + esc(r.hanzi) + '</button></td><td class="num">' + round(r.cost) + '</td><td>' + esc(costText(r.parts)) + '</td><td>' + said(r.said) + '</td></tr>').join('');
  const roots = (d.roots ?? []).slice(0, 30).map((r) => '<tr><td><button class="link" data-add="' + esc(r.root) + '">' + esc(r.root) + '</button> ' + esc(r.sound ?? '') + '</td><td class="num">' + r.score + '</td><td>' + esc(r.completes.slice(0, 8).map((w) => w.zh).join(' ')) + ' (' + r.completes.length + ')</td><td>' + (r.as.kind === 'sense' ? 'sense of ' + esc(r.as.term + ' ' + r.as.hanzi) : 'new word') + (r.toneNeighbour ? ' · near ' + esc(r.toneNeighbour.term + ' ' + r.toneNeighbour.hanzi) : '') + '</td></tr>').join('');
  const trades = d.swaps.map((s) => '<tr><td class="num">' + s.k + '</td><td>' + (s.adds.length ? 'bring in ' + esc(s.adds.join(' ')) + '; drop ' + esc(s.removes.join(', ')) : 'no trade pays') + '</td><td class="num">' + round(s.value) + '</td><td>+' + s.mandarin.gainedWords.length + ' / -' + s.mandarin.lostWords.length + ' Mandarin words, drop costs ' + round(s.cost) + '</td></tr>').join('');
  const none = '<p class="hint">No frequency list found (set HSD_FREQ_CSV).</p>';
  return '<section class="card"><h3>Words that could go (the ' + d.remove.length + ' cheapest of ' + d.total + ')</h3><div class="scroll"><table><thead><tr><th>word</th><th>cost</th><th>what it costs</th><th>said as (draft)</th></tr></thead><tbody>' + words + '</tbody></table></div></section>' +
    '<section class="card"><h3>Roots that would complete the most Mandarin words</h3>' + (d.roots ? '<div class="scroll"><table><thead><tr><th>root</th><th>score</th><th>completes</th><th>as</th></tr></thead><tbody>' + roots + '</tbody></table></div>' : none) + '</section>' +
    '<section class="card"><h3>Trades: K roots in, K words out</h3>' + (trades ? '<div class="scroll"><table><thead><tr><th>K</th><th>trade</th><th>value</th><th>effect</th></tr></thead><tbody>' + trades + '</tbody></table></div>' : none) + '</section>' +
    '<section class="card"><details><summary>The same as text</summary><pre class="text">' + esc(d.text) + '</pre></details></section>';
}

function addition(d) {
  const r = d.report;
  const chips = r.noFrequencies ? '' : '<div class="chips"><span class="chip ' + (r.completes.length ? 'hit' : 'zero') + '">' + r.completes.length + ' words completed</span><span class="chip">' + r.pending.length + ' need more roots</span><span class="chip">' + r.spellable.length + ' composites it lets be spelled</span></div>';
  return '<section class="card">' + chips + '<pre class="text">' + esc(d.text) + '</pre></section>';
}

function relationsReport(d) {
  const chips = d.kinds.map((k) => '<button class="chip link-chip" data-kind="' + esc(k) + '">' + esc(k) + ' · ' + d.counts[k].accepted + ' accepted, ' + d.counts[k].proposed + ' proposed</button>').join('');
  return '<section class="card"><div class="chips">' + chips + '</div><pre class="text">' + esc(d.text) + '</pre></section>';
}

function parsed(d) {
  if (d.view.error) return `<section class="card"><p>${esc(d.view.error)}</p></section>`;
  return d.view.sentences.map((s) => `<section class="card sentence">
    <div class="row"><h3>${esc(s.text)}</h3><span class="badge ${s.ok ? 'ok' : 'bad'}">${s.ok ? 'parses' : 'does not parse'}</span></div>
    ${s.ok
      ? `<div class="row"><span class="label">patterns</span><span>${s.patterns.map(esc).join(', ')}</span></div>
         ${s.treeCount > 1 ? `<div class="hint">${s.treeCount > 20 ? 'many' : s.treeCount} readings; the first three are shown.</div>` : ''}
         ${s.readings.map((r, i) => `<div class="row"><span class="label">reading ${i + 1}</span><code>${esc(r.bracket)}</code></div>${i === 0 ? `<details><summary>The structure, line by line</summary><pre class="text">${esc(r.outline)}</pre></details>` : ''}`).join('')}`
      : `<div>${esc(s.explain)}</div>
         ${s.problems.length ? `<div class="hint">${s.problems.map(esc).join('; ')}</div>` : ''}
         ${s.pieces.length ? `<div class="row"><span class="label">pieces that fit</span><code>${s.pieces.map((p) => `[${esc(p.sym)} ${esc(p.text)}]`).join(' ')}</code></div>` : ''}`}
  </section>`).join('');
}

async function ask() {
  const my = ++seq;
  const name = $('name').value.trim();
  const text = $('text').value.trim();
  if (mode !== 'parse' && mode !== 'atoms' && mode !== 'scoreboard' && mode !== 'candidates' && mode !== 'relations' && !name) return say(mode === 'add' ? 'Type a hanzi.' : 'Type a word.');
  if (mode === 'parse' && !text) return say('Type a sentence.');
  history.replaceState(null, '', `#${mode}=${encodeURIComponent(mode === 'parse' ? text : name)}`);
  say(mode === 'remove' || mode === 'atoms' || mode === 'scoreboard' ? 'Working it out (clingo)…' : mode === 'candidates' ? 'Working it out (a few seconds)…' : 'Looking…');
  $('out').innerHTML = '';
  try {
    const d = mode === 'word' ? await api('word', { name }) : mode === 'remove' ? await api('remove', { names: name }) : mode === 'atoms' ? await api('atoms', { name }) : mode === 'scoreboard' ? await api('scoreboard', {}) : mode === 'candidates' ? await api('candidates', {}) : mode === 'add' ? await api('add', { root: name }) : mode === 'relations' ? await api('relations', { kind: name, limit: 40 }) : await api('parse', { text });
    if (my !== seq) return;
    $('out').innerHTML = mode === 'word' ? wordCard(d) : mode === 'remove' ? removal(d) : mode === 'atoms' ? atomsReport(d) : mode === 'scoreboard' ? scoreboard(d) : mode === 'candidates' ? candidates(d) : mode === 'add' ? addition(d) : mode === 'relations' ? relationsReport(d) : parsed(d);
    say('');
  } catch (e) {
    if (my === seq) say(e.message, true);
  }
}

let timer;
$('name').addEventListener('input', () => {
  clearTimeout(timer);
  const last = $('name').value.split(/[,\s]+/).pop();
  if (!last) return;
  timer = setTimeout(async () => {
    try {
      const hits = await api('find', { q: last });
      const head = $('name').value.slice(0, $('name').value.length - last.length);
      $('suggest').innerHTML = hits.map((h) => `<option value="${esc(head + h.id)}">${esc(h.term)} ${esc(h.hanzi)} · ${esc(h.pos ?? '')}</option>`).join('');
    } catch { /* suggestions are a convenience */ }
  }, 150);
});

$('ask').addEventListener('submit', (e) => { e.preventDefault(); ask(); });
for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => {
  setMode(t.dataset.mode);
  // these need no question, so they open with their answer
  if (['atoms', 'scoreboard', 'candidates', 'relations'].includes(t.dataset.mode)) ask();
});
$('out').addEventListener('click', (e) => {
  const { remove, add, kind } = e.target.dataset ?? {};
  if (!remove && !add && !kind) return;
  setMode(remove ? 'remove' : add ? 'add' : 'relations');
  $('name').value = remove ?? add ?? kind;
  ask();
});

// #word=deng1, #remove=deng1,fan4, #parse=Wǒ shì rén., #atoms= or #atoms=deng1, #candidates=, #add=电, #relations=opposite, #scoreboard=
function fromHash() {
  const m = /^#(word|remove|parse|atoms|scoreboard|candidates|add|relations)=(.*)$/.exec(location.hash);
  if (!m) return setMode('word');
  setMode(m[1], { keep: true });
  (m[1] === 'parse' ? $('text') : $('name')).value = decodeURIComponent(m[2]);
  ask();
}
// ask() rewrites the hash with the same value, which does not fire this again
addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
