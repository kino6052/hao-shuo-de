<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hao-shuo-de Relations Review</title>
<style>
/* The relations review, served by the dev server (vite-plugin-review.js, /__review/?relations).
   Every relation a rule found or Claude drafted that waits for a yes or a no (KB_PLAN.md K18, phase 5).
   A yes makes it accepted, a no drops it; both are stored in review/decisions/relations-1.json. */
:root {
  --paper: #f3f5f2; --card: #fbfcfa; --ink: #1b2420; --muted: #5d6a64; --line: #d6ddd7;
  --accent: #1d6f55; --accent-ink: #ffffff; --accent-soft: #dcece4; --danger: #a3332b; --danger-soft: #f5dedb;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131916; --card: #1a221e; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3833;
    --accent: #4fbf94; --accent-ink: #0d1a14; --accent-soft: #1f3a2f; --danger: #ef7a70; --danger-soft: #3b1f1c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-body); }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; }
.lede { margin: 0 0 14px; color: var(--muted); max-width: 72ch; }
.bar { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-block: 10px; margin-bottom: 12px; align-items: center; }
.chip { font: 600 13px/1 var(--font-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--danger); }
.kind-note { margin: 18px 0 6px; font: 500 12px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.row.accept { border-color: var(--accent); background: var(--accent-soft); }
.row.reject { border-color: var(--danger); background: var(--danger-soft); }
.why { margin: 0; overflow-wrap: anywhere; }
.meta { margin: 2px 0 0; font: 400 12px/1.4 var(--font-mono); color: var(--muted); }
.acts { display: flex; gap: 6px; align-items: start; }
.acts button { font: 600 13px/1 var(--font-body); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.acts button[aria-pressed="true"].yes { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.acts button[aria-pressed="true"].no { background: var(--danger); color: #fff; border-color: var(--danger); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Relations review</h1>
  <p class="lede">Each line is a relation the knowledge base found or Claude drafted. Yes keeps it as an accepted relation; no drops it for good. Your answers are saved at once; the next load of the knowledge base applies them.</p>
  <div class="bar" id="bar"></div>
  <div id="list" aria-live="polite"></div>
</div>
<script>
const state = { data: null, kind: null, open: false };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
};
const say = (msg, err) => { const s = $('say'); if (s) { s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); } };

async function load() {
  const res = await fetch('relations-data');
  state.data = await res.json();
  render();
}

async function decide(key, status) {
  const had = state.data.decisions[key]?.status;
  const next = had === status ? null : status;
  const res = await fetch('relations-decide', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, status: next }) });
  const body = await res.json();
  if (!res.ok) return say(body.error ?? 'could not save', true);
  state.data.decisions = body.decisions;
  render();
  say('saved');
}

function render() {
  const { relations, decisions, notes } = state.data;
  const kinds = [...new Set(relations.map((r) => r.kind))];
  state.kind ??= kinds[0] ?? null;
  const bar = $('bar');
  bar.replaceChildren();
  for (const k of kinds) {
    const n = relations.filter((r) => r.kind === k).length;
    const left = relations.filter((r) => r.kind === k && !decisions[r.key]).length;
    const chip = el('button', { className: 'chip', type: 'button', textContent: `${k} ${left}/${n}` });
    chip.setAttribute('aria-pressed', String(k === state.kind));
    chip.onclick = () => { state.kind = k; render(); };
    bar.append(chip);
  }
  bar.append(el('span', { id: 'say', className: 'status' }));
  const list = $('list');
  list.replaceChildren();
  if (!kinds.length) return list.append(el('p', { className: 'lede', textContent: 'Nothing waits for review.' }));
  list.append(el('div', { className: 'kind-note', textContent: `${state.kind}: ${notes[state.kind] ?? ''}` }));
  const bySource = Object.groupBy(relations.filter((r) => r.kind === state.kind), (r) => r.source);
  for (const [source, items] of Object.entries(bySource)) {
    for (const r of items) {
      const d = decisions[r.key]?.status;
      const row = el('div', { className: 'row' + (d ? ' ' + d : '') });
      const text = el('div');
      text.append(el('p', { className: 'why', textContent: r.why }));
      text.append(el('p', { className: 'meta', textContent: [source, r.sub].filter(Boolean).join(' · ') }));
      const acts = el('div', { className: 'acts' });
      for (const [status, label, cls] of [['accept', 'Yes', 'yes'], ['reject', 'No', 'no']]) {
        const b = el('button', { type: 'button', className: cls, textContent: label });
        b.setAttribute('aria-pressed', String(d === status));
        b.onclick = () => decide(r.key, status);
        acts.append(b);
      }
      row.append(text, acts);
      list.append(row);
    }
  }
}
load().catch((e) => { $('list').textContent = 'Could not load: ' + e.message; });
</script>
</body>
</html>
